# TUEV follow-up: regularize the large classifier head while keeping the
# conservative adaptor schedule identified by the stability screen.
dataset_name: TUEV
dataset_path: prepared_data/TUEV
audit_path: results/tuev/audits/tuev_serialized_audit.json
source_preprocessing: preprocessing/preprocessing_tuev.py
checkpoint: weights/pretrained_weights.pth
output_root: results/tuev
method: full_finetune
batch_size: 8
epochs: 15
warmup_epochs: 3
num_workers: 0
lr: 0.0001
head_lr: 0.0001
adapter_lr: 0.000005
adapter_alpha_lr_scale: 0.05
weight_decay: 0.05
head_weight_decay: 0.05
adapter_weight_decay: 0.05
adapter_alpha_weight_decay: 0.0
input_scale_divisor: 100.0
num_classes: 6
selection_metric: cohen_kappa
dropout: 0.3
label_smoothing: 0.1
clip_grad: 1.0
adapter_bottleneck: 64
adapter_heads: 4
adapter_zero_init_output: true
adapter_init_alpha: 0.01
adapter_gamma: 1.0
lora_lr: 0.00005
upper_lr: 0.0001
scheduler_eta_min: 0.000001
